[package]
name = "dsh-desktop"
version = "0.1.0-1"
description = "Community Tauri 2 desktop distribution of DeepSeek Harness"
authors = ["DeepSeek Harness contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-updater = "2.9.0"

[lints.rust]
unsafe_code = "forbid"
